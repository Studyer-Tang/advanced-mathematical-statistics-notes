name: Build PDF

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-scripts:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - root: main.tex
            pdf: main.pdf
            artifact: chapter-01-cn
          - root: chapter02.tex
            pdf: chapter02.pdf
            artifact: chapter-02-cn
    steps:
      - uses: actions/checkout@v4
      - uses: xu-cheng/latex-action@v3
        with:
          root_file: ${{ matrix.root }}
          latexmk_use_xelatex: true
      - name: Rename output
        run: mv "${{ matrix.pdf }}" "${{ matrix.artifact }}.pdf"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.pdf
